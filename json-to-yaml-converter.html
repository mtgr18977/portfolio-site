<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="global.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON ⇄ YAML Converter</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border-color: #333;
            --accent-color: #3498db;
            --header-bg: #34495e;
            --alt-bg: #0f1724;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            max-width: 1400px;
            width: 100%;
            padding: 40px;
            border: 1px solid var(--border-color);
        }

        header {
            text-align: center;
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        h1 {
            color: var(--text-main);
            font-size: 2em;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95em;
            font-weight: 400;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding: 5px;
        }

        button {
            padding: 10px 20px;
            font-size: 0.9em;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
            white-space: nowrap;
        }

        .btn-convert {
            background: #3498db;
            color: white;
        }

        .btn-convert:hover {
            background: #2980b9;
        }

        .btn-clear {
            background: #95a5a6;
            color: white;
        }

        .btn-copy {
            background: #16a085;
            color: white;
        }

        .btn-swap {
            background: #34495e;
            color: white;
        }

        .btn-download {
            background: #9b59b6;
            color: white;
        }

        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (max-width: 968px) {
            .editor-container {
                grid-template-columns: 1fr;
            }
        }

        .editor-section {
            display: flex;
            flex-direction: column;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--header-bg);
            color: white;
            border-radius: 6px 6px 0 0;
            font-weight: 500;
            font-size: 0.95em;
        }

        textarea {
            flex: 1;
            min-height: 400px;
            padding: 20px;
            border: 2px solid var(--border-color);
            border-top: none;
            border-radius: 0 0 10px 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            padding: 20px;
            background-color: var(--alt-bg);
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: var(--accent-color);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9em;
            margin-top: 5px;
        }

        .examples {
            padding: 20px;
            background-color: var(--alt-bg);
            border-radius: 6px;
        }

        .examples h3 {
            color: var(--text-main);
            margin-bottom: 12px;
            font-size: 1em;
            font-weight: 500;
        }

        .upload-section {
            margin-bottom: 20px;
            padding: 20px;
            background-color: var(--alt-bg);
            border-radius: 6px;
            text-align: center;
        }

        .upload-section h3 {
            color: var(--text-main);
            margin-bottom: 15px;
            font-size: 1em;
            font-weight: 500;
        }

        .file-name {
            margin-top: 10px;
            color: var(--text-secondary);
            font-size: 0.9em;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            color: var(--text-secondary);
            font-size: 0.85em;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>JSON ⇄ YAML Converter</h1>
            <p class="subtitle">Converta facilmente entre JSON e YAML</p>
        </header>

        <div id="message" class="message"></div>

        <div class="upload-section">
            <h3>📁 Upload de Arquivo</h3>
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" accept=".json,.yaml,.yml" onchange="handleFileUpload(event)">
                <label for="fileInput" class="file-input-label">
                    📤 Escolher Arquivo (JSON ou YAML)
                </label>
            </div>
            <div class="file-name" id="fileName"></div>
        </div>

        <div class="controls">
            <button class="btn-convert" onclick="convertToYAML()">
                📄 JSON → YAML
            </button>
            <button class="btn-convert" onclick="convertToJSON()">
                📋 YAML → JSON
            </button>
            <button class="btn-swap" onclick="swapContent()">
                🔃 Trocar
            </button>
            <button class="btn-copy" onclick="copyOutput()">
                📋 Copiar Saída
            </button>
            <button class="btn-download" onclick="downloadOutput()">
                💾 Baixar Arquivo
            </button>
            <button class="btn-clear" onclick="clearAll()">
                🗑️ Limpar Tudo
            </button>
        </div>

        <div class="editor-container">
            <div class="editor-section">
                <div class="editor-header">
                    <span>Entrada</span>
                </div>
                <textarea id="input" placeholder="Cole seu JSON ou YAML aqui..."></textarea>
            </div>

            <div class="editor-section">
                <div class="editor-header">
                    <span>Saída</span>
                    <span class="arrow">→</span>
                </div>
                <textarea id="output" placeholder="O resultado aparecerá aqui..." readonly></textarea>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="inputLines">0</div>
                <div class="stat-label">Linhas Entrada</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="inputChars">0</div>
                <div class="stat-label">Caracteres Entrada</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="outputLines">0</div>
                <div class="stat-label">Linhas Saída</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="outputChars">0</div>
                <div class="stat-label">Caracteres Saída</div>
            </div>
        </div>

        <div class="examples">
            <h3>📚 Exemplos Rápidos:</h3>
            <button class="example-btn" onclick="loadExample('simple')">JSON Simples</button>
            <button class="example-btn" onclick="loadExample('nested')">JSON Aninhado</button>
            <button class="example-btn" onclick="loadExample('array')">JSON com Arrays</button>
            <button class="example-btn" onclick="loadExample('yaml')">YAML Exemplo</button>
        </div>

        <footer>
            <p>💡 Dica: Cole seu conteúdo e clique em "JSON → YAML" ou "YAML → JSON"</p>
        </footer>
    </div>

    <script>
        // Funções utilitárias para conversão JSON ↔ YAML
        
        function jsonToYaml(obj, indent = 0) {
            const spaces = '  '.repeat(indent);
            if (obj === null || obj === undefined) return indent === 0 ? 'null' : 'null';
            if (typeof obj === 'string') {
                const needsQuotes = obj.includes(':') || obj.includes('#') || obj.includes('[') || obj.includes(']') || obj.includes('{') || obj.includes('}') || obj.includes(',') || obj.includes('&') || obj.includes('*') || obj.includes('!') || obj.includes('|') || obj.includes('>') || obj.includes("'") || obj.includes('"') || obj.startsWith(' ') || obj.endsWith(' ') || obj.includes('\n') || obj === 'true' || obj === 'false' || obj === 'null' || obj === 'yes' || obj === 'no' || obj === 'on' || obj === 'off' || obj.match(/^-?\d+$/) || obj.match(/^-?\d*\.\d+$/);
                if (needsQuotes) return "'" + obj.replace(/'/g, "''") + "'";
                return obj;
            }
            if (typeof obj === 'number' || typeof obj === 'boolean') return String(obj);
            if (Array.isArray(obj)) {
                if (obj.length === 0) return '[]';
                let result = '';
                obj.forEach(item => {
                    if (item === null || item === undefined) result += '\n' + spaces + '- null';
                    else if (typeof item === 'object' && !Array.isArray(item)) {
                        const keys = Object.keys(item);
                        if (keys.length === 0) result += '\n' + spaces + '- {}';
                        else {
                            keys.forEach((key, idx) => {
                                const value = item[key];
                                const keyStr = jsonToYaml(key, 0);
                                if (idx === 0) result += '\n' + spaces + '- ' + keyStr + ':';
                                else result += '\n' + spaces + '  ' + keyStr + ':';
                                if (value === null || value === undefined) result += ' null';
                                else if (typeof value === 'object' && !Array.isArray(value)) result += '\n' + jsonToYaml(value, indent + 2);
                                else if (Array.isArray(value)) result += value.length === 0 ? ' []' : jsonToYaml(value, indent + 2);
                                else result += ' ' + jsonToYaml(value, 0);
                            });
                        }
                    } else if (Array.isArray(item)) result += '\n' + spaces + '-' + (item.length === 0 ? ' []' : jsonToYaml(item, indent + 1));
                    else result += '\n' + spaces + '- ' + jsonToYaml(item, 0);
                });
                return result;
            }
            if (typeof obj === 'object') {
                const keys = Object.keys(obj);
                if (keys.length === 0) return '{}';
                let result = '';
                keys.forEach((key, idx) => {
                    const value = obj[key];
                    const keyStr = jsonToYaml(key, 0);
                    const prefix = idx === 0 && indent === 0 ? '' : (idx === 0 ? '' : '\n' + spaces);
                    if (indent === 0 && idx > 0) result += '\n';
                    if (value === null || value === undefined) result += prefix + keyStr + ': null';
                    else if (typeof value === 'object' && !Array.isArray(value)) result += prefix + keyStr + ':\n' + (Object.keys(value).length === 0 ? '{}' : jsonToYaml(value, indent + 1));
                    else if (Array.isArray(value)) result += prefix + keyStr + ':' + (value.length === 0 ? ' []' : jsonToYaml(value, indent + 1));
                    else result += prefix + keyStr + ': ' + jsonToYaml(value, 0);
                });
                return result;
            }
            return String(obj);
        }

        function yamlToJson(yamlStr) {
            const lines = yamlStr.split('\n').filter(line => line.trim() && !line.trim().startsWith('#'));
            const root = {};
            const stack = [{ obj: root, indent: -1 }];
            lines.forEach(line => {
                const indent = line.search(/\S/);
                const trimmed = line.trim();
                if (trimmed.startsWith('-')) {
                    const value = trimmed.substring(1).trim();
                    let parent = stack[stack.length - 1];
                    while (parent.indent >= indent && stack.length > 1) { stack.pop(); parent = stack[stack.length - 1]; }
                    if (!Array.isArray(parent.obj[parent.key])) parent.obj[parent.key] = [];
                    if (value.includes(':')) {
                        const newObj = {}; parent.obj[parent.key].push(newObj);
                        const [k, v] = value.split(':').map(s => s.trim());
                        newObj[k] = parseValue(v); stack.push({ obj: newObj, key: k, indent });
                    } else parent.obj[parent.key].push(parseValue(value));
                } else if (trimmed.includes(':')) {
                    const [key, ...valueParts] = trimmed.split(':');
                    const value = valueParts.join(':').trim();
                    while (stack.length > 1 && stack[stack.length - 1].indent >= indent) stack.pop();
                    const parent = stack[stack.length - 1].obj;
                    if (value === '' || value === '{}' || value === '[]') {
                        parent[key.trim()] = value === '[]' ? [] : {};
                        stack.push({ obj: parent, key: key.trim(), indent });
                    } else parent[key.trim()] = parseValue(value);
                }
            });
            return root;
        }

        function parseValue(str) {
            if (!str || str === 'null') return null;
            if (str === 'true') return true;
            if (str === 'false') return false;
            if (!isNaN(str) && str.trim() !== '') return Number(str);
            if (str.startsWith('"') && str.endsWith('"')) return str.slice(1, -1);
            if (str.startsWith("'") && str.endsWith("'")) return str.slice(1, -1);
            return str;
        }

        function convertToYAML() {
            const input = document.getElementById('input').value.trim();
            if (!input) { showMessage('Por favor, insira algum JSON para converter.', 'error'); return; }
            try {
                const json = JSON.parse(input);
                const yaml = jsonToYaml(json);
                document.getElementById('output').value = yaml;
                showMessage('✅ Conversão JSON → YAML realizada com sucesso!', 'success');
                updateStats();
            } catch (error) { showMessage('❌ Erro: JSON inválido. Verifique a sintaxe.', 'error'); }
        }

        function convertToJSON() {
            const input = document.getElementById('input').value.trim();
            if (!input) { showMessage('Por favor, insira algum YAML para converter.', 'error'); return; }
            try {
                const json = yamlToJson(input);
                const output = JSON.stringify(json, null, 2);
                document.getElementById('output').value = output;
                showMessage('✅ Conversão YAML → JSON realizada com sucesso!', 'success');
                updateStats();
            } catch (error) { showMessage('❌ Erro: YAML inválido. Verifique a sintaxe.', 'error'); }
        }

        function swapContent() {
            const input = document.getElementById('input');
            const output = document.getElementById('output');
            const temp = input.value;
            input.value = output.value;
            output.value = temp;
            showMessage('🔃 Conteúdo trocado!', 'success');
            updateStats();
        }

        function copyOutput() {
            const output = document.getElementById('output');
            if (!output.value) { showMessage('Nada para copiar. Faça uma conversão primeiro.', 'error'); return; }
            output.select();
            document.execCommand('copy');
            showMessage('📋 Copiado para a área de transferência!', 'success');
        }

        function downloadOutput() {
            const output = document.getElementById('output');
            if (!output.value) { showMessage('Nada para baixar. Faça uma conversão primeiro.', 'error'); return; }
            const content = output.value.trim();
            let filename = content.startsWith('{') || content.startsWith('[') ? 'converted.json' : 'converted.yaml';
            let mimeType = content.startsWith('{') || content.startsWith('[') ? 'application/json' : 'text/yaml';
            const blob = new Blob([output.value], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a); URL.revokeObjectURL(url);
            showMessage(`💾 Arquivo ${filename} baixado com sucesso!`, 'success');
        }

        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('output').value = '';
            document.getElementById('fileName').textContent = '';
            showMessage('🗑️ Campos limpos!', 'success');
            updateStats();
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const fileExt = file.name.split('.').pop().toLowerCase();
            if (!['json', 'yaml', 'yml'].includes(fileExt)) { showMessage('❌ Tipo de arquivo inválido. Use .json, .yaml ou .yml', 'error'); return; }
            document.getElementById('fileName').textContent = `📄 ${file.name}`;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('input').value = e.target.result;
                updateStats();
                showMessage(`✅ Arquivo "${file.name}" carregado com sucesso!`, 'success');
                if (fileExt === 'json') setTimeout(() => convertToYAML(), 500);
                else setTimeout(() => convertToJSON(), 500);
            };
            reader.readAsText(file);
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 3000);
        }

        function updateStats() {
            const input = document.getElementById('input').value;
            const output = document.getElementById('output').value;
            document.getElementById('inputLines').textContent = input ? input.split('\n').length : 0;
            document.getElementById('inputChars').textContent = input.length;
            document.getElementById('outputLines').textContent = output ? output.split('\n').length : 0;
            document.getElementById('outputChars').textContent = output.length;
        }

        function loadExample(type) {
            const examples = {
                simple: '{\n  "name": "João Silva",\n  "age": 30,\n  "city": "São Paulo",\n  "active": true\n}',
                nested: '{\n  "user": {\n    "name": "Maria Santos",\n    "contact": {\n      "email": "maria@example.com",\n      "phone": "+55 11 99999-9999"\n    }\n  }\n}',
                array: '{\n  "company": "Tech Corp",\n  "employees": [\n    { "name": "Pedro", "role": "Developer" },\n    { "name": "Ana", "role": "Designer" }\n  ]\n}',
                yaml: 'name: João Silva\nage: 30\ncity: São Paulo\nactive: true\nskills:\n  - JavaScript\n  - Python'
            };
            document.getElementById('input').value = examples[type];
            document.getElementById('output').value = '';
            updateStats();
            showMessage('📝 Exemplo carregado! Clique em converter.', 'success');
        }

        document.getElementById('input').addEventListener('input', updateStats);
        document.getElementById('output').addEventListener('input', updateStats);
        updateStats();
    </script>
</body>
</html>
